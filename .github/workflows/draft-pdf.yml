name: Draft PDF
on: [push]
jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: JOSS/paper.md
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: paper
          path: JOSS/paper.pdf